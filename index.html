<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Gallery | Little Nzou</title>
  <style>
    body {
      background-color: #0f0f11;
      color: #ffffff;
      font-family: sans-serif;
      margin: 0;
      padding: 40px 20px;
    }
    .gallery-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .gallery-item {
      background: #1a1a1e;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .gallery-item img {
      max-width: 100%;
      height: auto;
      user-select: none; /* Prevents selecting image */
      -webkit-user-drag: none; /* Prevents dragging image */
    }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      color: #ff5500;
      text-decoration: none;
    }
  </style>
</head>
<!-- Optional: Disable right-click context menu to hinder simple image saving -->
<body oncontextmenu="return false;">

  <div class="gallery-header">
    <h1>Logo & Brand Mark Collection</h1>
    <a href="https://www.littlenzou.com" class="back-btn">&larr; Back to Main Website</a>
  </div>

  <div class="gallery-grid">
    <!-- Repeat this block for each logo -->
    <div class="gallery-item">
      <img src="images/logo1.png" alt="Brand Logo 1">
    </div>
    <div class="gallery-item">
      <img src="images/logo2.png" alt="Brand Logo 2">
    </div>
    <div class="gallery-item">
      <img src="images/logo3.png" alt="Brand Logo 3">
    </div>
  </div>

</body>
</html>
